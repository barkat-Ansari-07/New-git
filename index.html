<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            background-color: #111827;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 26px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 17px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Ali Skill</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

<img src="ba.jpg" width="100%" height="100%" style="border: 2px solid black;">
</body>
</html>
